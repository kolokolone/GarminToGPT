services:
  garmintogpt:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kolokolone/garmintogpt:latest
    container_name: garmintogpt

    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./garmintogpt/appdata:/appdata

    healthcheck:
      test: ["CMD", "gosu", "app", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
