services:
  garmintogpt:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kolokolone/garmintogpt:latest
    container_name: garmintogpt

    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      GARMINTOGPT_ENV: local
      GARMINTOGPT_CONFIG: /app/config/app.yaml
      GARMINTOGPT_LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"

    volumes:
      - garmintogpt_logs:/app/logs
      - garmintogpt_runtime:/app/runtime
      - ./data/garmin:/home/app/.config/garmin
      - ./data/garmintogpt:/home/app/.config/garmintogpt
      # Legacy named volumes: migrated automatically by the entrypoint.
      - garmintogpt_garmin:/legacy/garmin:ro
      - garmintogpt_openai:/legacy/garmintogpt:ro

    healthcheck:
      test: ["CMD", "gosu", "app", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    stop_grace_period: 30s

volumes:
  garmintogpt_logs:
  garmintogpt_runtime:
  garmintogpt_garmin:
  garmintogpt_openai: